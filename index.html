<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>مدیریت آزمون‌ها</title>

    <style>
      @font-face {
        font-family: "Mikhak";
        src: url("Mikhak-Regular.woff2") format("woff2");
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Mikhak";
      }

      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --green: #16a34a;
        --red: #dc2626;
        --orange: #ea580c;
        --shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
      }

      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      button,
      input {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      .container {
        width: min(1000px, calc(100% - 30px));
        margin: auto;
      }

      /* Header */
      header {
        background: white;
        border-bottom: 1px solid var(--border);
        padding: 20px 0;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        overflow: hidden;
      }

      .logo-icon img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        object-position: center;
        border-radius: inherit;
      }

      .logo h1 {
        font-size: 18px;
      }

      .logo span {
        color: var(--muted);
        font-size: 12px;
        display: block;
        margin-top: 4px;
      }

      /* Buttons */
      .btn {
        border: none;
        border-radius: 10px;
        padding: 11px 17px;
        font-size: 13px;
        transition: 0.2s;
      }

      .new-exam-thme {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-primary:hover {
        background: var(--primary-dark);
      }

      .btn-secondary {
        background: #eef0ff;
        color: var(--primary);
      }

      .btn-secondary:hover {
        background: #e0e3ff;
      }

      .btn-danger {
        background: #fee2e2;
        color: var(--red);
      }

      .btn-success {
        background: #dcfce7;
        color: var(--green);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Main */
      main {
        padding: 35px 0 60px;
      }

      .page-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
        gap: 15px;
      }

      .page-title h2 {
        font-size: 22px;
      }

      .page-title p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 7px;
      }

      /* Exams */
      .exams {
        display: grid;
        gap: 15px;
      }

      .exam-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .exam-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
      }

      .exam-title {
        font-size: 17px;
        font-weight: bold;
      }

      .exam-date {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 20px;
        font-size: 11px;
        white-space: nowrap;
      }

      .badge-pending {
        background: #fff7ed;
        color: var(--orange);
      }

      .badge-done {
        background: #dcfce7;
        color: var(--green);
      }

      .exam-info {
        display: flex;
        gap: 25px;
        margin: 18px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .exam-info strong {
        color: var(--text);
      }

      .exam-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .empty {
        text-align: center;
        padding: 70px 20px;
        background: white;
        border: 1px dashed var(--border);
        border-radius: 16px;
        color: var(--muted);
      }

      .empty-icon {
        font-size: 40px;
        margin-bottom: 15px;
      }

      /* Modal */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
      }

      .modal.active {
        display: flex;
      }

      .modal-box {
        width: min(500px, 100%);
        background: white;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .modal-header h3 {
        font-size: 18px;
      }

      .close {
        border: none;
        background: #f3f4f6;
        width: 35px;
        height: 35px;
        border-radius: 9px;
        font-size: 18px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        margin-bottom: 8px;
        font-weight: bold;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 13px;
        outline: none;
        font-size: 14px;
        direction: rtl;
      }

      .form-group input {
        height: 45px;
      }

      .form-group textarea {
        min-height: 180px;
        padding: 13px;
        line-height: 1.9;
        resize: vertical;
        font-family: inherit;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        border-color: var(--primary);
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
      }

      /* Exam page */
      .exam-page {
        display: none;
      }

      .exam-page.active {
        display: block;
      }

      .exam-header {
        background: white;
        border-bottom: 1px solid var(--border);
        padding: 18px 0;
      }

      .exam-header-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
      }

      .exam-header-title {
        font-weight: bold;
      }

      .exam-header-counter {
        color: var(--muted);
        font-size: 13px;
      }

      .question-container {
        max-width: 750px;
        margin: 40px auto;
      }

      .progress-wrapper {
        margin-bottom: 25px;
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .progress {
        height: 7px;
        background: #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background: var(--primary);
        width: 0%;
        transition: width 0.25s;
      }

      .question-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      .question-number {
        color: var(--primary);
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .question-text {
        font-size: 17px;
        font-weight: bold;
        line-height: 2;
        margin-bottom: 25px;
      }

      .options {
        display: grid;
        gap: 11px;
      }

      .option {
        width: 100%;
        min-height: 58px;
        background: white;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        display: flex;
        align-items: center;
        padding: 10px 14px;
        gap: 12px;
        text-align: right;
        transition: 0.15s;
      }

      .option:hover {
        border-color: #a5b4fc;
        background: #fafaff;
      }

      .option.selected {
        border-color: var(--primary);
        background: #eef0ff;
      }

      .option-number {
        width: 34px;
        height: 34px;
        min-width: 34px;
        border-radius: 9px;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: bold;
      }

      .option.selected .option-number {
        background: var(--primary);
        color: white;
      }

      .option-text {
        font-size: 13px;
      }

      .question-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
        gap: 10px;
      }

      .question-nav-center {
        color: var(--muted);
        font-size: 12px;
      }

      /* Result */
      .result-card {
        background: white;
        border-radius: 18px;
        padding: 30px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .result-title {
        font-size: 20px;
        margin-bottom: 8px;
      }

      .result-subtitle {
        color: var(--muted);
        font-size: 13px;
      }

      .result-percent {
        font-size: 45px;
        font-weight: bold;
        color: var(--primary);
        margin: 25px 0;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 25px;
      }

      .result-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 10px;
      }

      .result-number {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .result-label {
        color: var(--muted);
        font-size: 11px;
      }

      .correct {
        color: var(--green);
      }

      .wrong {
        color: var(--red);
      }

      .blank {
        color: var(--orange);
      }

      .back-home {
        margin-top: 25px;
      }

      /* Detailed result */
      .result-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .result-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 24px 0 15px;
      }

      .filter-btn {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .filter-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .question-results {
        display: grid;
        gap: 10px;
        margin-top: 12px;
        text-align: right;
      }

      .question-result {
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 14px;
        background: #fff;
      }

      .question-result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .question-result-number {
        font-weight: bold;
        font-size: 13px;
      }

      .question-status {
        font-size: 11px;
        padding: 5px 8px;
        border-radius: 999px;
      }

      .question-status.correct {
        background: #dcfce7;
      }

      .question-status.wrong {
        background: #fee2e2;
      }

      .question-status.blank {
        background: #ffedd5;
      }

      .answer-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }

      .answer-chip {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 7px 9px;
      }

      .notes-preview {
        margin-top: 14px;
        padding: 12px;
        border-radius: 12px;
        background: #fafaff;
        border: 1px solid #e0e3ff;
        text-align: right;
        font-size: 12px;
        line-height: 1.9;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .notes-label {
        color: var(--primary);
        font-weight: bold;
        margin-bottom: 4px;
      }

      .doubt-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: #fff7ed;
        border: 1px solid #f59e0b;
        color: #d97706;
        font-size: 13px;
        font-weight: 900;
        vertical-align: middle;
        margin-right: 7px;
      }

      .question-result-number-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .question-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 22px;
      }

      .question-header-row .question-text {
        flex: 1;
        margin-bottom: 0;
      }

      .doubt-toggle {
        width: 45px;
        height: 45px;
        border: 2px solid var(--border);
        border-radius: 13px;
        background: var(--card);
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        transition: 0.18s ease;
        box-shadow: 0 3px 10px rgba(15, 23, 42, 0.05);
        padding-top: 3px;
      }

      .doubt-toggle:hover {
        transform: translateY(-1px);
        border-color: var(--primary);
      }

      .doubt-toggle.active {
        background: #fff7ed;
        border-color: #f59e0b;
        color: #d97706;
        box-shadow: 0 5px 14px rgba(245, 158, 11, 0.16);
      }

      .doubt-toggle.disabled {
        cursor: default;
        opacity: 0.85;
      }

      .doubt-toggle.disabled:hover {
        transform: none;
      }

      /* Theme system */
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --green: #16a34a;
        --red: #dc2626;
        --orange: #ea580c;
        --input-bg: #ffffff;
        --option-bg: #ffffff;
        --option-hover: #fafaff;
        --secondary-bg: #eef0ff;
        --secondary-text: #4f46e5;
        --header-bg: #ffffff;
        --shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
      }

      body[data-theme="dark"] {
        --bg: #0f172a;
        --card: #182235;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #293548;
        --primary: #818cf8;
        --primary-dark: #6366f1;
        --green: #4ade80;
        --red: #f87171;
        --orange: #fb923c;
        --input-bg: #111827;
        --option-bg: #182235;
        --option-hover: #202b40;
        --secondary-bg: #242b4a;
        --secondary-text: #a5b4fc;
        --header-bg: #111827;
        --shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
      }

      body[data-theme="focus"] {
        --bg: #f1f5f1;
        --card: #ffffff;
        --text: #1f3328;
        --muted: #6b7c72;
        --border: #dce7df;
        --primary: #16805c;
        --primary-dark: #106b4c;
        --green: #16805c;
        --red: #dc4c4c;
        --orange: #d97706;
        --input-bg: #ffffff;
        --option-bg: #ffffff;
        --option-hover: #f0f8f3;
        --secondary-bg: #e4f2eb;
        --secondary-text: #16805c;
        --header-bg: #ffffff;
        --shadow: 0 8px 30px rgba(25, 70, 50, 0.08);
      }

      body {
        background: var(--bg);
        color: var(--text);
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      header,
      .exam-header {
        background: var(--header-bg);
        transition: background-color 0.25s ease;
      }

      .exam-card,
      .empty,
      .modal-box,
      .question-card,
      .result-card {
        background: var(--card);
        border-color: var(--border);
        box-shadow: var(--shadow);
        transition: background-color 0.25s ease, border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .form-group input,
      .form-group textarea {
        background: var(--input-bg);
        color: var(--text);
        border-color: var(--border);
      }

      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: var(--muted);
      }

      .option {
        background: var(--option-bg);
        color: var(--text);
        border-color: var(--border);
      }

      .option:hover {
        background: var(--option-hover);
      }

      .option.selected {
        background: var(--secondary-bg);
        border-color: var(--primary);
      }

      .option-number {
        background: var(--secondary-bg);
        color: var(--secondary-text);
      }

      .option.selected .option-number {
        background: var(--primary);
        color: white;
      }

      .btn-secondary {
        background: var(--secondary-bg);
        color: var(--secondary-text);
      }

      .progress {
        background: var(--border);
      }

      .close {
        background: var(--secondary-bg);
        color: var(--text);
      }

      .result-item {
        border-color: var(--border);
      }

      .modal {
        background: rgba(0, 0, 0, 0.55);
      }

      * {
        transition: background-color 0.2s ease, border-color 0.2s ease,
          color 0.2s ease;
      }

      /* Theme selector */
      .theme-selector {
        position: relative;
      }

      .theme-button {
        width: 43px;
        height: 43px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
      }

      .theme-button:hover {
        border-color: var(--primary);
        transform: translateY(-1px);
      }

      .theme-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 150px;
        padding: 6px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: none;
        z-index: 1000;
      }

      .theme-menu.active {
        display: block;
      }

      .theme-menu button {
        width: 100%;
        border: none;
        background: transparent;
        color: var(--text);
        padding: 10px 11px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 9px;
        text-align: right;
        font-size: 12px;
        cursor: pointer;
      }

      .theme-menu button:hover {
        background: var(--secondary-bg);
      }

      .theme-menu button span {
        flex: 1;
      }

      /* Responsive */
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      .header-inner {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding-left: 20px;
        padding-right: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .header-inner > div:last-child {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .container,
      main {
        width: 100%;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
      }

      .exam-card {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      @media (max-width: 600px) {
        .header-inner {
          padding: 14px 12px;
          gap: 8px;
        }

        .logo {
          min-width: 0;
          flex: 1;
        }

        .logo h1 {
          font-size: 18px;
        }

        .logo span {
          font-size: 11px;
        }

        .logo-icon {
          width: 38px;
          height: 38px;
          flex-shrink: 0;
          padding: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .logo-icon img {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }

        .btn-primary {
          white-space: nowrap;
          padding: 11px 13px;
          font-size: 12px;
        }

        .theme-button {
          width: 40px;
          height: 40px;
          flex-shrink: 0;
        }

        .theme-menu {
          right: auto !important;
          left: 0 !important;
          width: 150px !important;
          min-width: 150px !important;
          max-width: 150px !important;
          box-sizing: border-box;
        }

        .theme-menu button {
          width: 100%;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: flex-start;
          padding: 11px 12px;
          white-space: nowrap;
        }

        .container,
        main {
          width: 100%;
          padding-left: 12px;
          padding-right: 12px;
          box-sizing: border-box;
        }

        .exam-card {
          width: 100%;
          margin-left: 0;
          margin-right: 0;
          box-sizing: border-box;
        }

        .page-title h2 {
          font-size: 19px;
        }

    <script>
      /* =====================================================
       STORAGE
    ===================================================== */
      const STORAGE_KEY = "my_exam_manager_v1";
      let exams = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

      /* =====================================================
       MIGRATION: add attempts array to each exam
    ===================================================== */
      exams.forEach((exam) => {
        if (!Array.isArray(exam.attempts) || exam.attempts.length === 0) {
          // if exam has old answers field, convert to an attempt
          const oldAnswers = exam.answers;
          if (Array.isArray(oldAnswers)) {
            const attempt = {
              timestamp: exam.createdAt || new Date().toISOString(),
              answers: oldAnswers.slice(),
              completed: exam.completed || false,
            };
            exam.attempts = [attempt];
          } else {
            exam.attempts = [];
          }
          // remove old fields to avoid confusion
          delete exam.answers;
          delete exam.completed;
          // keep evaluated flag and result for backward compatibility but we'll use attempts
        }

        // ensure doubtFlags exists
        if (!Array.isArray(exam.doubtFlags)) {
          exam.doubtFlags = Array(exam.questionCount || 0).fill(false);
        } else if (exam.doubtFlags.length < (exam.questionCount || 0)) {
          exam.doubtFlags = exam.doubtFlags.concat(
            Array((exam.questionCount || 0) - exam.doubtFlags.length).fill(
              false,
            ),
          );
        }

        // ensure correctAnswers exists
        if (!Array.isArray(exam.correctAnswers)) {
          exam.correctAnswers = Array(exam.questionCount || 0).fill(null);
        }
        // evaluated flag based on correctAnswers being set
        if (exam.correctAnswers.some((a) => a !== null)) {
          exam.evaluated = true;
        } else {
          exam.evaluated = false;
        }

        // if old result exists but not stored per attempt, we can keep it but we'll compute on the fly
        if (exam.result) {
          // keep it for compatibility but we won't rely on it
        }
      });

      // save migrated data
      localStorage.setItem(STORAGE_KEY, JSON.stringify(exams));

      // current state
      let currentExamId = null;
      let currentAttemptIndex = -1;
      let currentQuestionIndex = 0;
      let currentMode = "exam"; // 'exam' or 'evaluation'

      /* =====================================================
       HELPERS
    ===================================================== */
      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(exams));
      }

      function gregorianToJalali(gy, gm, gd) {
        const gDaysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        const jDaysInMonth = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];
        let gy2 = gy - 1600;
        let gm2 = gm - 1;
        let gd2 = gd - 1;
        let gDayNo =
          365 * gy2 +
          Math.floor((gy2 + 3) / 4) -
          Math.floor((gy2 + 99) / 100) +
          Math.floor((gy2 + 399) / 400);
        for (let i = 0; i < gm2; ++i) gDayNo += gDaysInMonth[i];
        if (gm2 > 1 && ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0))
          gDayNo++;
        gDayNo += gd2;
        let jDayNo = gDayNo - 79;
        const jNp = Math.floor(jDayNo / 12053);
        jDayNo %= 12053;
        let jy = 979 + 33 * jNp + 4 * Math.floor(jDayNo / 1461);
        jDayNo %= 1461;
        if (jDayNo >= 366) {
          jy += Math.floor((jDayNo - 1) / 365);
          jDayNo = (jDayNo - 1) % 365;
        }
        let jm = 0;
        for (let i = 0; i < 11 && jDayNo >= jDaysInMonth[i]; ++i) {
          jDayNo -= jDaysInMonth[i];
          jm++;
        }
        const jd = jDayNo + 1;
        return [jy, jm + 1, jd];
      }

      function getTodayJalali() {
        const now = new Date();
        const r = gregorianToJalali(
          now.getFullYear(),
          now.getMonth() + 1,
          now.getDate(),
        );
        return (
          r[0] + "/" + String(r[1]).padStart(2, "0") + "/" + String(r[2]).padStart(2, "0")
        );
      }

      function toPersianNumber(number) {
        return String(number).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
      }

      function escapeHTML(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function findFirstUnanswered(answers) {
        return answers.findIndex((a) => a === null);
      }

      function formatTimestamp(iso) {
        try {
          const d = new Date(iso);
          return (
            d.toLocaleDateString("fa-IR") +
            " " +
            d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" })
          );
        } catch {
          return iso;
        }
      }

      /* =====================================================
       MODALS
    ===================================================== */
      function openNewExamModal() {
        document.getElementById("newExamModal").classList.add("active");
        document.getElementById("examDateInput").value = getTodayJalali();
        setTimeout(() => document.getElementById("examTitleInput").focus(), 100);
      }

      function closeNewExamModal() {
        document.getElementById("newExamModal").classList.remove("active");
        document.getElementById("examTitleInput").value = "";
        document.getElementById("examQuestionCountInput").value = "";
      }

      /* =====================================================
       CREATE EXAM
    ===================================================== */
      function createExam() {
        const title = document.getElementById("examTitleInput").value.trim();
        const date = document.getElementById("examDateInput").value.trim();
        const count = Number(
          document.getElementById("examQuestionCountInput").value,
        );
        if (!title) {
          alert("عنوان آزمون را وارد کنید.");
          return;
        }
        if (!date) {
          alert("تاریخ آزمون را وارد کنید.");
          return;
        }
        if (!count || count < 1) {
          alert("تعداد سؤالات را وارد کنید.");
          return;
        }

        const exam = {
          id: Date.now().toString(),
          title: title,
          date: date,
          questionCount: count,
          correctAnswers: Array(count).fill(null),
          doubtFlags: Array(count).fill(false),
          evaluated: false,
          notes: "",
          createdAt: new Date().toISOString(),
          attempts: [], // will be created when starting exam
        };

        exams.unshift(exam);
        saveData();
        closeNewExamModal();
        renderExams();
        startExam(exam.id, false);
      }

      /* =====================================================
       RENDER EXAMS LIST
    ===================================================== */
      function renderExams() {
        const container = document.getElementById("examsList");
        if (exams.length === 0) {
          container.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📝</div>
              <h3>هنوز آزمونی ثبت نکرده‌اید</h3>
              <p style="margin-top:8px">اولین آزمون خود را ثبت کنید.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = exams
          .map((exam) => {
            const hasCompleteAttempt = exam.attempts.some((a) => a.completed);
            const isEvaluated = exam.evaluated === true;
            const totalAttempts = exam.attempts.length;

            let badge = "";
            let badgeClass = "";
            if (isEvaluated && hasCompleteAttempt) {
              badge = "سنجش شده";
              badgeClass = "badge-done";
            } else if (!isEvaluated && hasCompleteAttempt) {
              badge = "آماده سنجش";
              badgeClass = "badge-pending";
            } else {
              badge = "در حال انجام";
              badgeClass = "badge-pending";
            }

            // count answered in latest incomplete attempt, or if none, 0
            let answeredCount = 0;
            const lastIncomplete = exam.attempts.find((a) => !a.completed);
            if (lastIncomplete) {
              answeredCount = lastIncomplete.answers.filter((a) => a !== null)
                .length;
            } else if (exam.attempts.length > 0) {
              // if all completed, use the last one
              const last = exam.attempts[exam.attempts.length - 1];
              answeredCount = last.answers.filter((a) => a !== null).length;
            }

            let resultHTML = "";
            if (isEvaluated && hasCompleteAttempt) {
              // show result of latest complete attempt (or selected later)
              const latestComplete = exam.attempts
                .filter((a) => a.completed)
                .pop();
              if (latestComplete) {
                const res = computeResult(exam, latestComplete.answers);
                resultHTML = `
                  <div style="margin-top:15px;padding-top:15px;border-top:1px solid var(--border);font-size:12px;">
                    نتیجهٔ آخرین تلاش:
                    <strong class="correct">${res.correct} صحیح</strong> ·
                    <strong class="wrong">${res.wrong} غلط</strong> ·
                    <strong class="blank">${res.blank} نزده</strong> ·
                    درصد: <strong>${res.percent}٪</strong>
                  </div>
                `;
              }
            }

            let actions = "";
            if (!isEvaluated) {
              if (hasCompleteAttempt) {
                actions += `
                  <button class="btn btn-primary" onclick="startEvaluation('${exam.id}')">
                    سنجش آزمون
                  </button>
                `;
              } else {
                actions += `
                  <button class="btn btn-primary" onclick="startExam('${exam.id}', false)">
                    ${lastIncomplete ? "ادامه آزمون" : "شروع آزمون"}
                  </button>
                `;
              }
            } else {
              // evaluated
              actions += `
                <button class="btn btn-secondary" onclick="showResult('${exam.id}')">
                  مشاهده نتیجه
                </button>
                <button class="btn btn-success" onclick="openNotesModal('${exam.id}')">
                  📝 ${exam.notes ? "ویرایش خلاصه" : "خلاصه‌نویسی"}
                </button>
                <button class="btn btn-primary" onclick="startExam('${exam.id}', true)">
                  🔄 آزمون مجدد
                </button>
              `;
            }

            actions += `
              <button class="btn btn-danger" onclick="deleteExam('${exam.id}')">
                حذف
              </button>
            `;

            return `
              <div class="exam-card">
                <div class="exam-top">
                  <div>
                    <div class="exam-title">${escapeHTML(exam.title)}</div>
                    <div class="exam-date">تاریخ آزمون: ${exam.date}</div>
                    <div class="exam-date" style="font-size:11px;color:var(--muted);margin-top:4px;">
                      تعداد تلاش‌ها: ${totalAttempts}
                    </div>
                  </div>
                  <span class="badge ${badgeClass}">${badge}</span>
                </div>

                <div class="exam-info">
                  <span>تعداد سؤالات: <strong>${exam.questionCount}</strong></span>
                  <span>پاسخ داده شده: <strong>${answeredCount}</strong></span>
                </div>

                <div class="exam-actions">${actions}</div>

                ${resultHTML}
              </div>
            `;
          })
          .join("");
      }

      /* =====================================================
       START EXAM (with optional newAttempt)
    ===================================================== */
      function startExam(id, newAttempt = false) {
        const exam = exams.find((e) => e.id === id);
        if (!exam) return;

        // if newAttempt is true, create a fresh attempt (only if evaluated? actually we allow anytime)
        // or if no attempts exist, create one
        let attemptIndex = -1;

        if (newAttempt) {
          // create new attempt with empty answers
          const newAttemptObj = {
            timestamp: new Date().toISOString(),
            answers: Array(exam.questionCount).fill(null),
            completed: false,
          };
          exam.attempts.push(newAttemptObj);
          attemptIndex = exam.attempts.length - 1;
        } else {
          // find incomplete attempt
          const idx = exam.attempts.findIndex((a) => !a.completed);
          if (idx !== -1) {
            attemptIndex = idx;
          } else {
            // no incomplete attempt: create one
            const newAttemptObj = {
              timestamp: new Date().toISOString(),
              answers: Array(exam.questionCount).fill(null),
              completed: false,
            };
            exam.attempts.push(newAttemptObj);
            attemptIndex = exam.attempts.length - 1;
          }
        }

        currentExamId = id;
        currentAttemptIndex = attemptIndex;
        currentMode = "exam";
        const answers = exam.attempts[attemptIndex].answers;
        currentQuestionIndex = findFirstUnanswered(answers);
        if (currentQuestionIndex === -1) currentQuestionIndex = exam.questionCount - 1;

        saveData();
        showExamPage();
        renderQuestion();
      }

      /* =====================================================
       START EVALUATION (mark correct answers)
    ===================================================== */
      function startEvaluation(id) {
        const exam = exams.find((e) => e.id === id);
        if (!exam) return;

        // make sure we have at least one complete attempt
        const hasComplete = exam.attempts.some((a) => a.completed);
        if (!hasComplete) {
          alert("هیچ تلاش کاملی برای سنجش وجود ندارد.");
          return;
        }

        currentExamId = id;
        currentMode = "evaluation";
        currentAttemptIndex = -1; // not used in evaluation mode
        // we need to set correctAnswers (maybe existing or new)
        // if correctAnswers already filled, we can edit them; otherwise start from scratch
        if (!Array.isArray(exam.correctAnswers) || exam.correctAnswers.length !== exam.questionCount) {
          exam.correctAnswers = Array(exam.questionCount).fill(null);
        }
        currentQuestionIndex = findFirstUnanswered(exam.correctAnswers);
        if (currentQuestionIndex === -1) currentQuestionIndex = exam.questionCount - 1;

        saveData();
        showExamPage();
        renderQuestion();
      }

      /* =====================================================
       SHOW EXAM PAGE
    ===================================================== */
      function showExamPage() {
        document.getElementById("homePage").style.display = "none";
        document.getElementById("examPage").classList.add("active");
        window.scrollTo(0, 0);
      }

      function returnToHome() {
        document.getElementById("examPage").classList.remove("active");
        document.getElementById("homePage").style.display = "block";
        renderExams();
        window.scrollTo(0, 0);
      }

      /* =====================================================
       RENDER QUESTION
    ===================================================== */
      function renderQuestion() {
        const exam = exams.find((e) => e.id === currentExamId);
        if (!exam) return;

        let answers;
        if (currentMode === "exam") {
          if (currentAttemptIndex === -1) {
            alert("خطا: تلاشی انتخاب نشده است.");
            return;
          }
          answers = exam.attempts[currentAttemptIndex].answers;
        } else {
          answers = exam.correctAnswers;
        }

        if (!Array.isArray(answers)) {
          answers = Array(exam.questionCount).fill(null);
        }

        const selected = answers[currentQuestionIndex];
        const isDoubt = exam.doubtFlags[currentQuestionIndex] === true;

        document.getElementById("runningExamTitle").textContent = exam.title;
        document.getElementById("runningExamMode").textContent =
          currentMode === "exam" ? "حالت آزمون" : "ثبت پاسخ‌های صحیح";

        document.getElementById("progressQuestion").textContent =
          `سؤال ${currentQuestionIndex + 1} از ${exam.questionCount}`;
        const percent = ((currentQuestionIndex + 1) / exam.questionCount) * 100;
        document.getElementById("progressPercent").textContent =
          `${Math.round(percent)}٪`;
        document.getElementById("progressBar").style.width = `${percent}%`;

        const doubtButton =
          currentMode === "exam"
            ? `
                <button
                  type="button"
                  class="doubt-toggle ${isDoubt ? "active" : ""}"
                  onclick="toggleDoubtFlag()"
                  aria-label="${isDoubt ? "غیرفعال کردن علامت شک" : "علامت‌گذاری سؤال به عنوان سؤال مشکوک"}"
                  title="${isDoubt ? "این سؤال برای مرور علامت‌گذاری شده" : "اگر با شک جواب داده‌ای، فعالش کن"}"
                >
                  !
                </button>
              `
            : `
                <div class="doubt-toggle ${isDoubt ? "active" : ""} disabled" title="این سؤال در آزمون به عنوان سؤال مشکوک علامت‌گذاری شده">
                  !
                </div>
              `;

        let html = `
          <div class="question-card">
            <div class="question-number">سؤال ${currentQuestionIndex + 1}</div>
            <div class="question-header-row">
              <div class="question-text">سؤال ${toPersianNumber(currentQuestionIndex + 1)}</div>
              ${doubtButton}
            </div>
            <div class="options">
        `;

        for (let i = 0; i < 4; i++) {
          const isSelected = selected === i;
          html += `
            <button type="button" class="option ${isSelected ? "selected" : ""}" onclick="selectOption(${i})">
              <span class="option-number">${toPersianNumber(i + 1)}</span>
              <span class="option-text">گزینه ${toPersianNumber(i + 1)}</span>
            </button>
          `;
        }

        html += `
            </div>
            <div class="question-nav">
              <button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? "disabled" : ""}>
                ← قبلی
              </button>
              <div class="question-nav-center">${currentQuestionIndex + 1} / ${exam.questionCount}</div>
              ${
                currentQuestionIndex === exam.questionCount - 1
                  ? `<button class="btn btn-primary" onclick="finishCurrentMode()">
                      ${currentMode === "exam" ? "پایان آزمون" : "ثبت سنجش"}
                    </button>`
                  : `<button class="btn btn-secondary" onclick="nextQuestion()">بعدی →</button>`
              }
            </div>
          </div>
        `;

        document.getElementById("questionArea").innerHTML = html;
      }

      /* =====================================================
       SELECT OPTION
    ===================================================== */
      function selectOption(optionIndex) {
        const exam = exams.find((e) => e.id === currentExamId);
        if (!exam) return;

        let answers;
        if (currentMode === "exam") {
          if (currentAttemptIndex === -1) return;
          answers = exam.attempts[currentAttemptIndex].answers;
        } else {
          answers = exam.correctAnswers;
        }

        answers[currentQuestionIndex] = optionIndex;
        saveData();

        if (currentQuestionIndex < exam.questionCount - 1) {
          setTimeout(() => {
            currentQuestionIndex++;
            renderQuestion();
          }, 120);
        } else {
          renderQuestion();
        }
      }

      /* =====================================================
       NAVIGATION
    ===================================================== */
      function previousQuestion() {
        if (currentQuestionIndex <= 0) return;
        currentQuestionIndex--;
        renderQuestion();
      }

      function nextQuestion() {
        const exam = exams.find((e) => e.id === currentExamId);
        if (!exam) return;
        if (currentQuestionIndex < exam.questionCount - 1) {
          currentQuestionIndex++;
          renderQuestion();
        }
      }

      /* =====================================================
       TOGGLE DOUBT FLAG
    ===================================================== */
      function toggleDoubtFlag() {
        const exam = exams.find((e) => e.id === currentExamId);
        if (!exam || currentMode !== "exam") return;
        exam.doubtFlags[currentQuestionIndex] = !exam.doubtFlags[currentQuestionIndex];
        saveData();
        renderQuestion();
      }

      /* =====================================================
       FINISH CURRENT MODE (exam or evaluation)
    ===================================================== */
      function finishCurrentMode() {
        const exam = exams.find((e) => e.id === currentExamId);
        if (!exam) return;

        if (currentMode === "exam") {
          if (currentAttemptIndex === -1) return;
          const attempt = exam.attempts[currentAttemptIndex];
          const answered = attempt.answers.filter((a) => a !== null).length;
          const unanswered = exam.questionCount - answered;
          if (unanswered > 0) {
            const confirmFinish = confirm(
              `هنوز ${unanswered} سؤال را پاسخ نداده‌اید.\nآیا می‌خواهید آزمون را تمام کنید؟`,
            );
            if (!confirmFinish) return;
          }
          attempt.completed = true;
          saveData();
          returnToHome();
        } else {
          // evaluation mode
          const missingIndex = exam.correctAnswers.findIndex((a) => a === null);
          if (missingIndex !== -1) {
            alert(`پاسخ صحیح سؤال ${missingIndex + 1} هنوز ثبت نشده است.`);
            currentQuestionIndex = missingIndex;
            renderQuestion();
            return;
          }
          exam.evaluated = true;
          saveData();
          // show result of the latest complete attempt
          const latestComplete = exam.attempts.filter((a) => a.completed).pop();
          if (latestComplete) {
            showResult(exam.id);
          } else {
            alert("هیچ تلاش کاملی برای نمایش نتیجه وجود ندارد.");
            returnToHome();
          }
        }
      }

      /* =====================================================
       COMPUTE RESULT for a given answers array
    ===================================================== */
      function computeResult(exam, answers) {
        let correct = 0,
          wrong = 0,
          blank = 0;

        for (let i = 0; i < exam.questionCount; i++) {
          const user = answers[i];
          const correctAns = exam.correctAnswers[i];

          if (user === null) {
            blank++;
          } else if (correctAns !== null && user === correctAns) {
            correct++;
          } else {
            wrong++;
          }
        }

        /*
          محاسبه درصد با نمره منفی:

          هر پاسخ صحیح = +1
          هر پاسخ غلط   = -1/3
          هر پاسخ نزده   = 0

          فرمول:
          ((صحیح - غلط / 3) / کل سوالات) × 100

          مثال:
          37 صحیح، 8 غلط، 10 نزده
          ((37 - 8/3) / 55) × 100 = 62.42%
        */
        const percent =
          exam.questionCount === 0
            ? 0
            : ((correct - wrong / 3) / exam.questionCount) * 100;

        return {
          correct,
          wrong,
          blank,
          percent: Number(percent.toFixed(2)),
        };
      }

      /* =====================================================
       SHOW RESULT with attempt selector
    ===================================================== */
      function showResult(id, filter = "all", selectedAttemptIndex = -1) {
        const exam = exams.find((e) => e.id === id);
        if (!exam) return;
        if (!exam.evaluated) {
          alert("این آزمون هنوز سنجش نشده است.");
          return;
        }

        // find all complete attempts
        const completeAttempts = exam.attempts.filter((a) => a.completed);
        if (completeAttempts.length === 0) {
          alert("هیچ تلاش کاملی برای نمایش وجود ندارد.");
          returnToHome();
          return;
        }

        // select index: if -1, use the latest
        if (selectedAttemptIndex === -1) {
          selectedAttemptIndex = completeAttempts.length - 1;
        }
        if (selectedAttemptIndex >= completeAttempts.length) {
          selectedAttemptIndex = completeAttempts.length - 1;
        }
        const attempt = completeAttempts[selectedAttemptIndex];
        const result = computeResult(exam, attempt.answers);

        // build attempt selector options
        let optionsHTML = completeAttempts
          .map((a, idx) => {
            const label = formatTimestamp(a.timestamp);
            const selectedAttr = idx === selectedAttemptIndex ? "selected" : "";
            return `<option value="${idx}" ${selectedAttr}>${label}</option>`;
          })
          .join("");

        // override currentExamId for notes modal
        currentExamId = id;

        // show exam page with result
        document.getElementById("homePage").style.display = "none";
        document.getElementById("examPage").classList.add("active");
        document.getElementById("runningExamTitle").textContent = exam.title;
        document.getElementById("runningExamMode").textContent = "نتیجه آزمون";
        document.getElementById("progressQuestion").textContent = "نتیجه نهایی";
        document.getElementById("progressPercent").textContent = `${result.percent}٪`;
        document.getElementById("progressBar").style.width = "100%";

        // build question details for the selected attempt
        const questions = exam.answers
          ? exam.answers.map((userAnswer, index) => {
              // but we need answers from attempt, not exam.answers
              // use attempt.answers
              const ua = attempt.answers[index];
              const ca = exam.correctAnswers[index];
              let status, statusClass;
              if (ua === null) {
                status = "نزده";
                statusClass = "blank";
              } else if (ca !== null && ua === ca) {
                status = "صحیح";
                statusClass = "correct";
              } else {
                status = "غلط";
                statusClass = "wrong";
              }
              return {
                index,
                userAnswer: ua,
                correctAnswer: ca,
                status,
                statusClass,
                isDoubt:
                  Array.isArray(exam.doubtFlags) && exam.doubtFlags[index] === true,
              };
            })
          : [];

        // but above uses exam.answers incorrectly; we should use attempt.answers
        // let's recompute using attempt.answers
        const questionDetails = [];
        for (let i = 0; i < exam.questionCount; i++) {
          const ua = attempt.answers[i];
          const ca = exam.correctAnswers[i];
          let status, statusClass;
          if (ua === null) {
            status = "نزده";
            statusClass = "blank";
          } else if (ca !== null && ua === ca) {
            status = "صحیح";
            statusClass = "correct";
          } else {
            status = "غلط";
            statusClass = "wrong";
          }
          questionDetails.push({
            index: i,
            userAnswer: ua,
            correctAnswer: ca,
            status,
            statusClass,
            isDoubt:
              Array.isArray(exam.doubtFlags) && exam.doubtFlags[i] === true,
          });
        }

        const filteredQuestions = questionDetails.filter((q) => {
          if (filter === "wrong") return q.statusClass === "wrong";
          if (filter === "blank") return q.statusClass === "blank";
          if (filter === "correct") return q.statusClass === "correct";
          return true;
        });

        const optionText = (answer) =>
          answer === null ? "نزده" : `گزینه ${toPersianNumber(answer + 1)}`;

        const questionHTML = filteredQuestions.length
          ? filteredQuestions
              .map(
                (q) => `
                <div class="question-result">
                  <div class="question-result-head">
                    <div class="question-result-number-wrap">
                      <div class="question-result-number">سؤال ${toPersianNumber(q.index + 1)}</div>
                      ${q.isDoubt ? '<span class="doubt-badge" title="با شک جواب داده شده">!</span>' : ""}
                    </div>
                    <span class="question-status ${q.statusClass}">${q.status}</span>
                  </div>
                  <div class="answer-row">
                    <span class="answer-chip">پاسخ شما: <strong>${optionText(q.userAnswer)}</strong></span>
                    <span class="answer-chip">پاسخ صحیح: <strong>${optionText(q.correctAnswer)}</strong></span>
                  </div>
                </div>
              `,
              )
              .join("")
          : `<div class="empty" style="padding:35px 15px">موردی برای نمایش در این فیلتر وجود ندارد.</div>`;

        const notesHTML = exam.notes
          ? `
            <div class="notes-preview">
              <div class="notes-label">📝 خلاصه و نکات آزمون</div>
              ${escapeHTML(exam.notes)}
            </div>
          `
          : "";

        // build HTML
        document.getElementById("questionArea").innerHTML = `
          <div class="result-card">
            <div class="result-title">نتیجه ${escapeHTML(exam.title)}</div>
            <div class="result-subtitle">تاریخ آزمون: ${exam.date}</div>

            <!-- Attempt selector -->
            <div class="attempt-selector" style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;">
              <label style="font-size:13px;color:var(--muted);">انتخاب تلاش:</label>
              <select id="attemptSelector" onchange="onAttemptChange('${exam.id}')">
                ${optionsHTML}
              </select>
              <button
                class="btn btn-danger"
                style="padding:8px 12px;font-size:11px;"
                onclick="deleteAttempt('${exam.id}', ${selectedAttemptIndex})"
                ${completeAttempts.length <= 1 ? "disabled" : ""}
                title="${completeAttempts.length <= 1 ? "حداقل یک پاسخگویی باید باقی بماند" : "حذف این تلاش"}"
              >
                🗑️ حذف این تلاش
              </button>
            </div>

            <div class="result-percent">${result.percent}٪</div>

            <div class="result-grid">
              <div class="result-item">
                <div class="result-number correct">${result.correct}</div>
                <div class="result-label">صحیح</div>
              </div>
              <div class="result-item">
                <div class="result-number wrong">${result.wrong}</div>
                <div class="result-label">غلط</div>
              </div>
              <div class="result-item">
                <div class="result-number blank">${result.blank}</div>
                <div class="result-label">نزده</div>
              </div>
            </div>

            <div style="margin-top:20px;color:var(--muted);font-size:12px">تعداد کل سؤالات: ${exam.questionCount}</div>

            <div class="result-actions">
              <button class="btn btn-success" onclick="openNotesModal('${exam.id}')">
                📝 ${exam.notes ? "ویرایش خلاصه" : "خلاصه‌نویسی"}
              </button>
            </div>

            ${notesHTML}

            <div class="result-filters">
              <button class="filter-btn ${filter === "all" ? "active" : ""}" onclick="showResult('${exam.id}', 'all', ${selectedAttemptIndex})">همه (${exam.questionCount})</button>
              <button class="filter-btn ${filter === "wrong" ? "active" : ""}" onclick="showResult('${exam.id}', 'wrong', ${selectedAttemptIndex})">غلط‌ها (${result.wrong})</button>
              <button class="filter-btn ${filter === "blank" ? "active" : ""}" onclick="showResult('${exam.id}', 'blank', ${selectedAttemptIndex})">نزده‌ها (${result.blank})</button>
              <button class="filter-btn ${filter === "correct" ? "active" : ""}" onclick="showResult('${exam.id}', 'correct', ${selectedAttemptIndex})">صحیح‌ها (${result.correct})</button>
            </div>

            <div class="question-results">${questionHTML}</div>

            <div class="back-home">
              <button class="btn btn-primary" onclick="returnToHome()">بازگشت به آزمون‌ها</button>
            </div>
          </div>
        `;

        window.scrollTo(0, 0);
      }

      /* =====================================================
       onAttemptChange (called from dropdown)
    ===================================================== */
      function onAttemptChange(examId) {
        const select = document.getElementById("attemptSelector");
        if (!select) return;
        const idx = parseInt(select.value, 10);
        if (!isNaN(idx)) {
          showResult(examId, "all", idx);
        }
      }

      /* =====================================================
       DELETE ATTEMPT
       حذف یک پاسخگویی/تلاش کامل

       قانون:
       - حداقل یک تلاش کامل برای هر آزمون باید باقی بماند.
       - فقط تلاش‌های کامل از لیست نتایج حذف می‌شوند.
       - حذف یک تلاش، خود آزمون و پاسخ‌های صحیح آن را حذف نمی‌کند.
    ===================================================== */
      function deleteAttempt(examId, completeAttemptIndex) {
        const exam = exams.find((e) => e.id === examId);
        if (!exam) return;

        const completeAttempts = exam.attempts.filter((a) => a.completed);

        // حداقل یک پاسخگویی باید باقی بماند.
        if (completeAttempts.length <= 1) {
          alert("حداقل یک پاسخگویی برای هر آزمون باید باقی بماند.");
          return;
        }

        if (
          completeAttemptIndex < 0 ||
          completeAttemptIndex >= completeAttempts.length
        ) {
          return;
        }

        const attemptToDelete = completeAttempts[completeAttemptIndex];
        const attemptNumber = completeAttemptIndex + 1;
        const attemptDate = formatTimestamp(attemptToDelete.timestamp);

        const confirmed = confirm(
          `آیا مطمئن هستید می‌خواهید پاسخگویی شماره ${attemptNumber} را حذف کنید؟\n\nتاریخ: ${attemptDate}\n\nاین عملیات قابل بازگشت نیست.`
        );

        if (!confirmed) return;

        // پیدا کردن همان تلاش در آرایه اصلی و حذف آن
        const actualIndex = exam.attempts.indexOf(attemptToDelete);

        if (actualIndex === -1) {
          alert("تلاش موردنظر پیدا نشد.");
          return;
        }

        exam.attempts.splice(actualIndex, 1);

        saveData();

        // بعد از حذف، اگر هنوز تلاش کامل وجود دارد، نتیجه آخرین تلاش نمایش داده شود.
        const remainingCompleteAttempts = exam.attempts.filter(
          (a) => a.completed
        );

        if (remainingCompleteAttempts.length > 0) {
          showResult(exam.id);
        } else {
          // حالت احتیاطی؛ با قانون حداقل یک تلاش نباید به اینجا برسیم.
          exam.evaluated = false;
          saveData();
          returnToHome();
        }
      }

      /* =====================================================
       NOTES
    ===================================================== */
      function openNotesModal(id) {
        const exam = exams.find((e) => e.id === id);
        if (!exam || !exam.evaluated) return;
        currentExamId = id;
        document.getElementById("notesInput").value = exam.notes || "";
        document.getElementById("notesModal").classList.add("active");
        setTimeout(() => document.getElementById("notesInput").focus(), 100);
      }

      function closeNotesModal() {
        document.getElementById("notesModal").classList.remove("active");
      }

      function saveNotes() {
        const exam = exams.find((e) => e.id === currentExamId);
        if (!exam) return;
        exam.notes = document.getElementById("notesInput").value.trim();
        saveData();
        closeNotesModal();
        renderExams();
        // refresh result if showing
        const isResultPage = document.getElementById("examPage").classList.contains("active");
        if (isResultPage) {
          showResult(exam.id);
        }
      }

      /* =====================================================
       DELETE EXAM
    ===================================================== */
      function deleteExam(id) {
        const exam = exams.find((e) => e.id === id);
        if (!exam) return;
        if (!confirm(`آیا از حذف آزمون «${exam.title}» مطمئن هستید؟`)) return;
        exams = exams.filter((e) => e.id !== id);
        saveData();
        renderExams();
      }

      /* =====================================================
       THEME SYSTEM
    ===================================================== */
      const THEME_STORAGE_KEY = "exam_manager_theme";

      function applyTheme(theme) {
        const body = document.body;
        if (theme === "dark") {
          body.setAttribute("data-theme", "dark");
        } else if (theme === "focus") {
          body.setAttribute("data-theme", "focus");
        } else {
          body.removeAttribute("data-theme");
        }
        localStorage.setItem(THEME_STORAGE_KEY, theme);
      }

      function setTheme(theme) {
        applyTheme(theme);
        closeThemeMenu();
      }

      function toggleThemeMenu() {
        document.getElementById("themeMenu").classList.toggle("active");
      }

      function closeThemeMenu() {
        document.getElementById("themeMenu").classList.remove("active");
      }

      document.addEventListener("click", function (event) {
        const selector = document.querySelector(".theme-selector");
        if (!selector) return;
        if (!selector.contains(event.target)) {
          closeThemeMenu();
        }
      });

      function loadSavedTheme() {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        if (savedTheme === "dark" || savedTheme === "focus" || savedTheme === "light") {
          applyTheme(savedTheme);
        } else {
          applyTheme("light");
        }
      }

      /* =====================================================
       INIT
    ===================================================== */
      loadSavedTheme();
      renderExams();
    </script>
  </body>
</html>
